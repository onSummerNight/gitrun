name: Sync Garmin and publish Gitrun

on:
  push:
    branches: [main]
  schedule:
    # Every six hours; avoid the busy start of the hour. UTC.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: gitrun-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the website
        run: |
          npm run check
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install sync dependencies
        run: python -m pip install -r requirements.txt
      - name: Test sync normalization and encryption
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check Garmin connection
        id: connection
        env:
          GARMIN_SESSION_KEY: ${{ secrets.GARMIN_SESSION_KEY }}
        run: |
          if [ -n "$GARMIN_SESSION_KEY" ] && [ -f .sync/garmin.enc ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = 'schedule' ]; then
            echo '::error::Garmin is not connected. Run scripts/garmin_setup.py and add the session key secret.'
            exit 1
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Garmin is not connected; publishing current website data.'
          fi
      - name: Fetch running history
        id: sync
        if: steps.connection.outputs.ready == 'true'
        continue-on-error: true
        env:
          GARMIN_SESSION_KEY: ${{ secrets.GARMIN_SESSION_KEY }}
        run: python scripts/garmin_sync.py
      - name: Save data and rotated encrypted session
        if: always() && steps.connection.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .sync/garmin.enc dist/data/activities.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update running history and encrypted Garmin session'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve the last deployed page if Garmin failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::Garmin sync failed. Reconnect Garmin if the session expired. The last deployed page stays online.'
          exit 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
